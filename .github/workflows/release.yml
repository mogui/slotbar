name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # Intel: the arm64 runner queue times out.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          # Xcode 26.3 fails the universal build of SwiftTerm's build-tool plugin; 26.6 builds it.
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
